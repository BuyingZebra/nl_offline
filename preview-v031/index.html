<style>

#app{position:relative;margin:auto;height:100dvh;max-width:520px;background:var(--bg);overflow:hidden;box-shadow:0 0 80px #000}#map,#maplibre,#fallback{position:absolute;inset:0}#maplibre{z-index:1}
/* The screen layers PAINT BLACK at the top/bottom of the phone, reaching

#screenTopFade,#screenBottomFade{position:absolute;left:0;right:0;z-index:3;
 height:0;pointer-events:none;opacity:1}
#screenTopFade{top:0;background:linear-gradient(to bottom,#000,transparent)}
#screenBottomFade{bottom:0;background:linear-gradient(to top,#000,transparent)}
/* Geographic-edge fades are a transparent canvas projected onto the actual

#map{background:#07170f}
:root[data-theme=amber] #map{background:#160d05}
#mapEdgeFade{position:absolute;inset:0;z-index:2;width:100%;height:100%;
 pointer-events:none;display:block}
.gradient-row{display:grid;grid-template-columns:minmax(112px,1.12fr) minmax(95px,1fr) 35px;
 gap:6px;align-items:center;min-height:49px}
.gradient-label{display:flex;align-items:center;gap:7px;min-width:0;min-height:44px;
 font-size:10px;letter-spacing:.035em;white-space:nowrap;cursor:pointer}
.gradient-label input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.gradient-row output{text-align:right;font-size:10px;font-variant-numeric:tabular-nums;color:var(--accent)}
.gradient-row .effect-slider{margin:0}
#fallback{z-index:2;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#fallback.dragging{cursor:grabbing}/* Compositing-inspired shared phosphor controls. CRT and vignette cover the whole app. */
#mapgrid{position:absolute;inset:0;z-index:101;pointer-events:none;
 background:repeating-linear-gradient(to bottom,
   rgba(var(--phosphor-rgb),.15) 0px,rgba(var(--phosphor-rgb),.15) 1px,
   transparent 1px,transparent 3px,rgba(0,0,0,.59) 3px,rgba(0,0,0,.59) 4px);
 opacity:var(--scan-intensity,0)}
/* A very faint traveling phosphor-refresh edge, above the whole interface.
   It has a crisp front and a broad, softer tail behind it. */
#phosphorSweep{position:absolute;left:0;right:0;top:-90px;height:90px;
 z-index:100;pointer-events:none;will-change:transform;
 background:linear-gradient(to bottom,

 rgba(var(--phosphor-rgb),.025) 55%,
 rgba(var(--phosphor-rgb),.055) 83%,
 rgba(var(--phosphor-rgb),.11) 97%,rgba(var(--phosphor-rgb),.17) 100%);
 border-bottom:1px solid rgba(var(--phosphor-rgb),.23);

@keyframes phosphorSweepDown{

}
/* Instant, opacity-only click flare. Its light derives from button currentColor
   and the shared glow slider, never a hard-coded bright theme-wide outline. */
#app button.phosphor-reactive{position:relative}
#app button .phosphor-hit-layer{
 position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;opacity:0;color:inherit;
 border:1px solid color-mix(in srgb,currentColor var(--glow-strength),transparent);
 background:radial-gradient(ellipse at center,
  color-mix(in srgb,currentColor var(--glow-strength),transparent),transparent 88%);
 box-shadow:0 0 var(--glow-radius) color-mix(in srgb,currentColor var(--glow-strength),transparent),

input[type=range].effect-slider::-moz-range-progress{

input[type=range].effect-slider::-moz-range-thumb{

 width:58px;height:58px;min-width:58px;min-height:58px;padding:0;border-radius:50%;

#compassNeedle{display:flex;align-items:center;justify-content:center;flex-direction:column;

#compassNeedle .compass-n{font-size:9px;line-height:13px;letter-spacing:.07em}
#compassNeedle .compass-pointer{font-size:26px;line-height:30px}#crosshair{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);pointer-events:none;color:var(--accent);font-size:29px;opacity:.6}#pinMarker{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-95%);pointer-events:none;font-size:28px;color:var(--accent);display:none}
#pinTray{position:absolute;z-index:6;bottom:var(--pin-tray-bottom,200px);
 left:10px;right:10px;display:none;flex-direction:column;gap:8px;

 border-radius:10px;backdrop-filter:blur(12px)}
#pinTray.open{display:flex}

#pinTrayTitle b{font-size:11px}

.saved-row button small{font-size:9px;color:var(--weak);font-weight:400}

#footer{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;right:10px;padding:11px}#readout{display:grid;grid-template-columns:1fr 1fr 65px;gap:10px}#readout small{display:block;font-size:9px;color:var(--weak);letter-spacing:.13em}#readout b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:5px}#nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px}#nav button{font-size:10px;padding:7px 3px;white-space:nowrap}#footnote{border-top:1px solid var(--line);margin-top:10px;padding-top:9px;color:var(--weak);font-size:9px;display:flex;justify-content:space-between;gap:8px}

}

}
#mapAttribution{font-size:8px;text-align:right;margin-top:3px}
#mapAttribution a{color:var(--weak);text-decoration:none}

@media (orientation:landscape) and (max-height:550px){#app{max-width:100%}#head{top:7px;left:8px;right:auto;width:245px;padding:6px 10px;min-height:50px}#wordmark b{font-size:13px}#wordmark small{font-size:8px}#status{top:62px;left:8px;right:auto;width:245px;font-size:8px}#footer{left:8px;right:auto;width:245px;bottom:7px;padding:8px}#controls{right:7px;top:7px;gap:6px;flex-direction:row}#controls button{width:43px;height:43px}#compass{left:auto;right:213px;top:7px;
 width:45px;height:45px;min-width:45px;min-height:45px}
#compassNeedle .compass-pointer{font-size:21px;line-height:24px}
#compassNeedle .compass-n{font-size:8px;line-height:11px}
#nav{grid-template-columns:repeat(2,1fr);margin-top:7px}#nav button{min-height:35px}#readout{gap:5px}#footnote{margin-top:5px;padding-top:5px;font-size:8px}#toast{left:270px;right:10px;bottom:12px}#sheetShade{align-items:center;justify-content:flex-end}#sheet{width:min(410px,65vw);max-height:94vh}}
@media (min-width:600px){#app{outline:1px solid #224d32}}

<body>
<div id="app">
  <!-- Screen fades are black overlays; map fades are alpha masks. -->
  <div id="map"><div id="maplibre" aria-label="MapLibre interactive map"></div><canvas id="fallback" aria-label="Interactive illustrative map fallback"></canvas><canvas id="mapEdgeFade" aria-hidden="true"></canvas><div id="screenTopFade" aria-hidden="true"></div><div id="screenBottomFade" aria-hidden="true"></div></div>
  <div id="crosshair">＋</div><div id="pinMarker">⬟</div>
  <header class="overlay panel" id="head"><div id="wordmark"><small>FIELD ATLAS / NEWFOUNDLAND</small><b>NAVIGATION SYSTEM</b></div><button id="theme" title="Switch phosphor colour" aria-label="Switch phosphor colour"><span id="themeGlyph" aria-hidden="true">◐</span></button></header>
  <div id="status" class="overlay" data-type="warning" role="status" aria-live="polite" aria-atomic="true"><span id="consolePrefix">CONSOLE:</span><span id="statusMessage">&gt; [SYS] INITIALIZING MAP</span></div>

   <div id="pinTrayTitle"><b>⌖ PLACE PIN / MAP CENTRE</b><span id="pinCoordinates">—</span></div>

<script src="./osm-phosphor-protocol.js?v=0312"></script>
<script>
'use strict';
// Release identifier displayed continuously in the compact console header.
const APP_VERSION='0.31';
const PLACES=[
  {name:'Carbonear',region:'Conception Bay North',lng:-53.2270,lat:47.7350,zoom:14.2},
  {name:'Harbour Grace',region:'Conception Bay North',lng:-53.2110,lat:47.6925,zoom:13.8},
  {name:'Bay Roberts',region:'Conception Bay North',lng:-53.2620,lat:47.5980,zoom:13.8},
  {name:"Spaniard’s Bay",region:'Conception Bay North',lng:-53.2820,lat:47.6180,zoom:13.5},
  {name:'Heart’s Content',region:'Trinity Bay',lng:-53.3680,lat:47.8670,zoom:13.8},
  {name:'St. John’s',region:'Avalon Peninsula',lng:-52.7130,lat:47.5620,zoom:12.8},
];
// Small local shortcuts remain available if the full community index fails
// to load. They are not the source of truth for the community directory.
let officialPlaces=[];
let placesIndexState='loading';
const $=id=>document.getElementById(id);
$('consolePrefix').textContent='CONSOLE v'+APP_VERSION+':';
const state={theme:'green',mapRenderer:'vector',real:false,map:null,zoom:14.2,panX:0,panY:0,showBuildings:true,showWaterGrid:true,waterGridStrength:65,gradients:{
 screenTop:{enabled:true,length:165},screenBottom:{enabled:false,length:110},
 mapTop:{enabled:true,length:110},mapBottom:{enabled:false,length:100}
},effects:{glow:65,vignette:30,scanlines:26},pin:false,pinAt:null,route:null,center:PLACES[0],saved:[],loadMessage:'',gpsLocation:null};
try{
 state.saved=JSON.parse(localStorage.getItem('fieldAtlasPinsV02')||'[]');
 if(!Array.isArray(state.saved))state.saved=[];
 state.saved=state.saved.filter(p=>p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&
  Math.abs(p.lat)<=85.051129&&Math.abs(p.lng)<=180)
  .map((p,i)=>({name:typeof p.name==='string'&&p.name.trim()?p.name.slice(0,70):'PIN '+(i+1),
   lat:p.lat,lng:p.lng}));
}catch(e){state.saved=[];}
try{
 const saved=JSON.parse(localStorage.getItem('fieldAtlasEffectsV06')||'null');
 const previous=JSON.parse(localStorage.getItem('fieldAtlasEffectsV05')||'null');
 if(saved && typeof saved==='object'){
   for(const k of Object.keys(state.effects))
     if(Number.isFinite(saved[k]))state.effects[k]=Math.round(Math.max(0,Math.min(100,saved[k])));
 }else if(previous && typeof previous==='object'){

function startLiveMap(){if(typeof window.maplibregl==='undefined'){status('DEMO / MAP LIBRARY BLOCKED',true,'MAP');return}try{

});

m.on('move',updateReadout);m.on('error',e=>{if(!state.real)status('DEMO / MAP SERVICE ERROR',true,'MAP')});setTimeout(()=>{if(!state.real)status('DEMO / WAITING FOR TILES',true,'MAP')},7000)}catch(e){status('DEMO / MAP INITIALIZATION FAILED',true,'MAP')}}

function loadRemoteMap(){
 const version='5.9.0';
 const hosts=['https://unpkg.com/maplibre-gl@'+version+'/dist/',
              'https://cdn.jsdelivr.net/npm/maplibre-gl@'+version+'/dist/'];
 const css=document.createElement('link');
 css.rel='stylesheet';css.href=hosts[0]+'maplibre-gl.css';
 css.onerror=()=>{css.href=hosts[1]+'maplibre-gl.css'};
 document.head.appendChild(css);
 let i=0;
 function tryNext(){
  if(window.maplibregl){startLiveMap();return}
  if(i>=hosts.length){
   status('DEMO / MAP LIBRARY UNAVAILABLE',true,'MAP');
   return;
  }

  const script=document.createElement('script');
  script.src=host+'maplibre-gl.js';script.async=true;

   if(window.maplibregl)startLiveMap();

  };
  script.onerror=()=>tryNext();

 tryNext();
