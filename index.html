<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#06170e"/>
<title>FIELD ATLAS / NL · Interactive Browser Preview</title>
<style>
:root{--bg:#06170e;--panel:#0a2115;--panel-solid:#102719;--accent:#a4ffbb;--roads:#6cf296;--weak:#82af8f;--line:#39764c;--water:#103b2b;--building:#255c38;--shadow:#020905;--glow:rgba(98,255,156,.22)}
:root[data-theme=night]{--bg:#0d1621;--panel:#182634;--panel-solid:#1c2938;--accent:#d5e9fa;--roads:#a4bdce;--weak:#899fae;--line:#3b526a;--water:#163646;--building:#324a61;--shadow:#030810;--glow:rgba(96,176,244,.18)}
*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#020603;color:var(--accent);font:12px ui-monospace,Menlo,Consolas,monospace}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;appearance:none;border:1px solid var(--line);border-radius:8px;background:var(--panel-solid);color:var(--accent);font-weight:700;letter-spacing:.07em;min-height:44px;padding:8px 12px}button:hover{border-color:var(--roads)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}button:active{background:var(--line)}
#app{position:relative;margin:auto;height:100dvh;max-width:520px;background:var(--bg);overflow:hidden;box-shadow:0 0 80px #000}#map,#maplibre,#fallback{position:absolute;inset:0}#maplibre{z-index:1}#fallback{z-index:2;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#fallback.dragging{cursor:grabbing}#mapgrid{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.05) 4px);opacity:.65}#mapgrid.off{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(13px)}.overlay{position:absolute;z-index:5}#head{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;min-height:64px;display:flex;align-items:center;gap:9px;padding:9px 12px}#wordmark{flex:1;min-width:0}#wordmark small{display:block;color:var(--weak);letter-spacing:.14em;font-size:9px}#wordmark b{font-size:17px;letter-spacing:.13em;display:block;margin-top:3px}#theme{min-width:46px;padding:0;font-size:18px}#status{top:calc(env(safe-area-inset-top,0px) + 83px);left:10px;right:10px;color:var(--accent);font-size:9px;letter-spacing:.055em;background:rgba(2,9,5,.82);border:1px solid var(--line);padding:7px 9px;border-radius:6px;display:flex;gap:8px;align-items:center}#status[data-type=warning]{color:#ffd18b}#status .led{width:7px;height:7px;background:currentColor;box-shadow:0 0 9px currentColor;border-radius:50%;flex:none}#controls{right:10px;top:31%;display:flex;flex-direction:column;gap:8px}#controls button{width:47px;height:47px;padding:0;font-size:21px}#compass{left:15px;top:31%;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(5,22,11,.66);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;pointer-events:none}#compass:before{content:'N';position:absolute;top:4px;font-size:9px}#compass span{padding-top:10px}#crosshair{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);pointer-events:none;color:var(--accent);text-shadow:0 0 10px var(--roads);font-size:29px;opacity:.6}#pinMarker{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-95%);pointer-events:none;font-size:28px;color:var(--accent);text-shadow:0 0 10px var(--roads);display:none}
#footer{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;right:10px;padding:11px}#readout{display:grid;grid-template-columns:1fr 1fr 65px;gap:10px}#readout small{display:block;font-size:9px;color:var(--weak);letter-spacing:.13em}#readout b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:5px}#nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px}#nav button{font-size:10px;padding:7px 3px;white-space:nowrap}#footnote{border-top:1px solid var(--line);margin-top:10px;padding-top:9px;color:var(--weak);font-size:9px;display:flex;justify-content:space-between;gap:8px}
#toast{position:absolute;z-index:8;left:10px;right:10px;bottom:207px;text-align:center;background:var(--panel-solid);border:1px solid var(--line);border-radius:7px;padding:10px;color:var(--accent);font-size:11px;display:none}#toast.show{display:block}#sheetShade{position:absolute;z-index:10;inset:0;background:rgba(0,0,0,.64);display:none;align-items:flex-end;padding:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}#sheetShade.open{display:flex}#sheet{width:100%;max-height:76vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 -7px 35px #0008}#sheethead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}#sheetTitle{font-weight:800;letter-spacing:.1em;font-size:14px}#sheetClose{font-size:19px;min-width:43px;min-height:43px;padding:0}.sheetText{color:var(--weak);font-size:11px;line-height:1.6}.line{height:1px;background:var(--line);margin:12px 0}.field{display:block;margin:10px 0 4px;color:var(--weak);font-size:10px;letter-spacing:.1em}input,select{width:100%;background:var(--bg);color:var(--accent);border:1px solid var(--line);padding:12px;border-radius:7px;min-height:44px}.list{display:grid;gap:6px;margin-top:10px}.list button{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.list button small{font-size:9px;color:var(--weak);font-weight:400}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);width:100%;margin-top:12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.setting b{font-size:11px}.setting button{min-width:85px}.warning{color:#ffd18b}.hint{font-size:10px;color:var(--weak)}
@media (orientation:landscape) and (max-height:550px){#app{max-width:100%}#head{top:7px;left:8px;right:auto;width:245px;padding:6px 10px;min-height:50px}#wordmark b{font-size:13px}#wordmark small{font-size:8px}#status{top:62px;left:8px;right:auto;width:245px;font-size:8px}#footer{left:8px;right:auto;width:245px;bottom:7px;padding:8px}#controls{right:7px;top:7px;gap:6px;flex-direction:row}#controls button{width:43px;height:43px}#compass{display:none}#nav{grid-template-columns:repeat(2,1fr);margin-top:7px}#nav button{min-height:35px}#readout{gap:5px}#footnote{margin-top:5px;padding-top:5px;font-size:8px}#toast{left:270px;right:10px;bottom:12px}#sheetShade{align-items:center;justify-content:flex-end}#sheet{width:min(410px,65vw);max-height:94vh}}
@media (min-width:600px){#app{outline:1px solid #224d32}}
</style>
</head>
<body>
<div id="app">
  <div id="map"><div id="maplibre" aria-label="MapLibre interactive map"></div><canvas id="fallback" aria-label="Interactive illustrative map fallback"></canvas><div id="mapgrid" class="off"></div></div>
  <div id="crosshair">＋</div><div id="pinMarker">⬟</div>
  <header class="overlay panel" id="head"><div id="wordmark"><small>FIELD ATLAS / NEWFOUNDLAND</small><b>NAVIGATION SYSTEM</b></div><button id="theme" title="Switch between green and dark maps" aria-label="Toggle theme">◐</button></header>
  <div id="status" class="overlay" data-type="warning"><span class="led"></span><span id="statusMessage">Starting interactive preview…</span></div>
  <div class="overlay" id="compass"><span>▲</span></div>
  <div class="overlay" id="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="gps" title="Use phone GPS" aria-label="My location">◎</button><button id="home" title="Return to Carbonear" aria-label="Home">⌂</button></div>
  <div class="overlay panel" id="footer">
    <div id="readout"><div><small>LATITUDE</small><b id="latitude">—</b></div><div><small>LONGITUDE</small><b id="longitude">—</b></div><div><small>ZOOM</small><b id="zoomvalue">14.2</b></div></div>
    <div id="nav"><button id="searchBtn">⌕ SEARCH</button><button id="routeBtn">↗ ROUTE</button><button id="pinBtn">⌖ PIN</button><button id="menuBtn">☷ MENU</button></div>
    <div id="footnote"><span id="modeText">BROWSER PREVIEW</span><span id="gpsText">GPS ● OFF</span></div>
  </div>
  <div id="toast" aria-live="polite"></div>
  <div id="sheetShade"><div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheethead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Close">×</button></div><div id="sheetContent"></div></div></div>
</div>
<script>
'use strict';
const PLACES=[
  {name:'Carbonear',region:'Conception Bay North',lng:-53.2270,lat:47.7350,zoom:14.2},
  {name:'Harbour Grace',region:'Conception Bay North',lng:-53.2110,lat:47.6925,zoom:13.8},
  {name:'Bay Roberts',region:'Conception Bay North',lng:-53.2620,lat:47.5980,zoom:13.8},
  {name:"Spaniard’s Bay",region:'Conception Bay North',lng:-53.2820,lat:47.6180,zoom:13.5},
  {name:'Heart’s Content',region:'Trinity Bay',lng:-53.3680,lat:47.8670,zoom:13.8},
  {name:'St. John’s',region:'Avalon Peninsula',lng:-52.7130,lat:47.5620,zoom:12.8},
];
const $=id=>document.getElementById(id); const state={theme:'green',real:false,map:null,zoom:14.2,panX:0,panY:0,showBuildings:true,showGrid:false,pin:false,pinAt:null,route:null,center:PLACES[0],saved:[],loadMessage:'',gpsLocation:null};
try{state.saved=JSON.parse(localStorage.getItem('fieldAtlasPinsV02')||'[]');if(!Array.isArray(state.saved))state.saved=[];}catch(e){state.saved=[];}
function isReal(){return !!(state.real&&state.map)}
function status(message,warning=false){$('statusMessage').textContent=message;$('status').dataset.type=warning?'warning':'ok';$('modeText').textContent=state.real?'LIVE OPENSTREETMAP / ONLINE':'INTERACTIVE DEMO / NOT GEOGRAPHIC'}
let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v,axis){return (Math.abs(v).toFixed(4)+'°'+((axis==='lat')?(v>=0?'N':'S'):(v<0?'W':'E')))}
function updateReadout(){if(isReal()){const c=state.map.getCenter();$('latitude').textContent=fmt(c.lat,'lat');$('longitude').textContent=fmt(c.lng,'lng');$('zoomvalue').textContent=state.map.getZoom().toFixed(1);}else{$('latitude').textContent='DEMO';$('longitude').textContent='DEMO';$('zoomvalue').textContent=state.zoom.toFixed(1)}}
function theme(){state.theme=state.theme==='green'?'night':'green';document.documentElement.dataset.theme=state.theme;if(isReal())state.map.setStyle(makeStyle());drawFallback();toast(state.theme==='green'?'PIP-BOY GREEN':'NIGHT BLUE')}
$('theme').addEventListener('click',theme);$('plus').addEventListener('click',()=>zoomBy(1));$('minus').addEventListener('click',()=>zoomBy(-1));$('gps').addEventListener('click',getGPS);$('home').addEventListener('click',()=>viewPlace(PLACES[0]));$('searchBtn').addEventListener('click',openSearch);$('routeBtn').addEventListener('click',openRoute);$('pinBtn').addEventListener('click',togglePin);$('menuBtn').addEventListener('click',openMenu);$('sheetClose').addEventListener('click',closeSheet);$('sheetShade').addEventListener('click',e=>{if(e.target===$('sheetShade'))closeSheet()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function zoomBy(step){if(isReal())state.map.zoomTo(Math.min(19,Math.max(4,state.map.getZoom()+step)),{duration:250});else{state.zoom=Math.min(18.5,Math.max(10, state.zoom+step));drawFallback();updateReadout()}}
function viewPlace(p){state.center=p;state.pin=false;state.pinAt=null;$('pinMarker').style.display='none';state.route=null;if(isReal())state.map.flyTo({center:[p.lng,p.lat],zoom:p.zoom,speed:1.6});else{state.panX=0;state.panY=0;state.zoom=p.zoom;drawFallback();toast('Illustrative map only — live map required to view '+p.name);}updateReadout();closeSheet()}
function getGPS(){if(!navigator.geolocation){toast('GPS is unavailable in this browser.');return}toast('Requesting location permission…');navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude,accuracy}=pos.coords;state.gpsLocation={latitude,longitude};$('gpsText').textContent='GPS ● '+Math.round(accuracy)+'m';if(isReal())state.map.flyTo({center:[longitude,latitude],zoom:15});else toast('GPS coordinates acquired; demo map cannot position them geographically.');},e=>toast('GPS unavailable: '+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
function togglePin(){state.pin=!state.pin;$('pinMarker').style.display=state.pin?'block':'none';state.pinAt=isReal()?state.map.getCenter():null;if(state.pin){toast('CENTRE PIN SELECTED');openPin()}else toast('PIN CLEARED')}
function openPin(){openSheet('PIN / MAP CENTRE',`<p class="sheetText">${isReal()?'Pin will be stored at the geographic centre of the visible map.':'This is a design fallback: no geographic point can be saved until the live map loads.'}</p><button class="primary" id="savePin" ${!isReal()?'disabled':''}>SAVE MAP CENTRE</button>`);$('savePin').addEventListener('click',()=>{if(!isReal())return;const c=state.map.getCenter();const item={name:'Saved point '+(state.saved.length+1),lat:c.lat,lng:c.lng};state.saved.push(item);try{localStorage.setItem('fieldAtlasPinsV02',JSON.stringify(state.saved))}catch(e){}closeSheet();toast('PIN SAVED TO THIS BROWSER')})}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetContent').innerHTML=html;$('sheetShade').classList.add('open')}
function closeSheet(){$('sheetShade').classList.remove('open')}
function placeResults(q){const results=PLACES.filter(p=>(p.name+' '+p.region).toLowerCase().includes(q.toLowerCase()));$('placesList').innerHTML=results.length?results.map(p=>`<button data-place="${PLACES.indexOf(p)}"><span>${esc(p.name)}</span><small>${esc(p.region)} ↗</small></button>`).join(''):'<p class="sheetText">No matching preset. Street/address search is not in this prototype.</p>'; $('placesList').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>viewPlace(PLACES[Number(b.dataset.place)])))}
function openSearch(){openSheet('SEARCH / COMMUNITIES',`<p class="sheetText">Search six community shortcuts. These are viewpoints, not civic-address search or road routing.</p><input id="placeQuery" type="search" autocomplete="off" placeholder="Search Carbonear, Bay Roberts…" aria-label="Search communities"/><div id="placesList" class="list"></div>`);$('placeQuery').addEventListener('input',e=>placeResults(e.target.value));placeResults('');$('placeQuery').focus()}
function distanceKm(a,b){const r=Math.PI/180,dlat=(b.lat-a.lat)*r,dlng=(b.lng-a.lng)*r,s=Math.sin(dlat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dlng/2)**2;return (6371*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))).toFixed(1)}
function setRouteGeoJSON(){if(!isReal()||!state.map.isStyleLoaded())return;try{const source=state.map.getSource('route-preview');if(!source)return;source.setData({type:'FeatureCollection',features:state.route?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[[state.route.a.lng,state.route.a.lat],[state.route.b.lng,state.route.b.lat]]}}]:[]})}catch(e){}}
function chooseRoute(a,b){state.route={a,b};closeSheet();if(isReal()){setRouteGeoJSON();state.map.fitBounds([[Math.min(a.lng,b.lng),Math.min(a.lat,b.lat)],[Math.max(a.lng,b.lng),Math.max(a.lat,b.lat)]],{padding:80,maxZoom:13,duration:500});toast('STRAIGHT-LINE '+distanceKm(a,b)+' KM — NOT DRIVING DIRECTIONS');}else toast('Route planner is not yet implemented. '+distanceKm(a,b)+' km straight-line only.');}
function openRoute(){openSheet('ROUTE / CONCEPT',`<p class="sheetText warning">Road routing is NOT implemented. This panel compares selected communities using straight-line distance only — never use it for driving directions.</p><label class="field" for="startPoint">FROM</label><select id="startPoint">${PLACES.map((p,i)=>`<option value="${i}" ${p.name===state.center.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label class="field" for="endPoint">TO</label><select id="endPoint">${PLACES.map((p,i)=>`<option value="${i}" ${p.name==='Bay Roberts'?'selected':''}>${esc(p.name)}</option>`).join('')}</select><p class="sheetText" id="distanceText"></p><button id="routePreview" class="primary">SHOW STRAIGHT-LINE PREVIEW</button>`);const update=()=>{const a=PLACES[Number($('startPoint').value)],b=PLACES[Number($('endPoint').value)];$('distanceText').textContent=a===b?'Select different communities.':distanceKm(a,b)+' km direct distance, not driving distance';$('routePreview').disabled=a===b};$('startPoint').addEventListener('change',update);$('endPoint').addEventListener('change',update);$('routePreview').addEventListener('click',()=>chooseRoute(PLACES[Number($('startPoint').value)],PLACES[Number($('endPoint').value)]));update()}
function openMenu(){openSheet('FIELD ATLAS / SYSTEM',`<p class="sheetText">Interactive browser development preview. The real vector map needs internet access here; native offline-pack support must be tested separately on a phone.</p><div class="line"></div><div class="setting"><b>THEME</b><button id="themeSetting">${state.theme==='green'?'GREEN':'NIGHT'}</button></div><div class="setting"><b>BUILDING FOOTPRINTS</b><button id="buildingSetting">${state.showBuildings?'ON':'OFF'}</button></div><div class="setting"><b>CRT / GRID LINES</b><button id="gridSetting">${state.showGrid?'ON':'OFF'}</button></div><div class="line"></div><button id="savedSetting" style="width:100%">SAVED PINS (${state.saved.length})</button><div class="line"></div><p class="sheetText"><b>BROWSER CAPABILITIES:</b> live OpenStreetMap vector rendering (when map service loads), map pan/zoom, preset community viewing, GPS with permission, theme change, marker saving, and direct-distance comparison.</p><p class="sheetText warning">NOT YET AVAILABLE: street/address lookup, road routing, turn-by-turn navigation, complete offline map cache.</p>`);
$('themeSetting').onclick=()=>{theme();openMenu()};$('buildingSetting').onclick=()=>{state.showBuildings=!state.showBuildings;if(isReal()&&state.map.getLayer('buildings'))state.map.setLayoutProperty('buildings','visibility',state.showBuildings?'visible':'none');drawFallback();openMenu()};$('gridSetting').onclick=()=>{state.showGrid=!state.showGrid;$('mapgrid').classList.toggle('off',!state.showGrid);openMenu()};$('savedSetting').onclick=openSaved}
function openSaved(){openSheet('SAVED MAP POINTS',`<p class="sheetText">These points are stored only in this browser.</p><div id="savedList" class="list"></div><button id="clearPins" style="width:100%;margin-top:12px" ${!state.saved.length?'disabled':''}>CLEAR SAVED PINS</button>`);const list=$('savedList');list.innerHTML=state.saved.length?state.saved.map((p,i)=>`<button data-id="${i}"><span>${esc(p.name)}</span><small>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</small></button>`).join(''):'<p class="sheetText">No saved pins yet. Use PIN while the real map is visible.</p>';list.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=state.saved[Number(b.dataset.id)];closeSheet();if(isReal())state.map.flyTo({center:[p.lng,p.lat],zoom:16})});$('clearPins').onclick=()=>{state.saved=[];try{localStorage.setItem('fieldAtlasPinsV02','[]')}catch(e){}openSaved()}}
// Interactive fallback is intentionally SCHEMATIC. It is never presented as Newfoundland geography.
const canvas=$('fallback'),ctx=canvas.getContext('2d');let fW=390,fH=740,drag=null;
const roads=[{width:6,points:[[-60,620],[40,530],[90,460],[155,394],[223,310],[275,234],[354,115],[465,40]]},{width:3.3,points:[[-90,165],[60,207],[184,177],[300,171],[480,187]]},{width:3.2,points:[[38,-70],[76,70],[112,143],[145,390],[175,800]]},{width:3.1,points:[[-70,345],[90,340],[183,357],[286,386],[490,385]]},{width:3.1,points:[[-60,465],[102,508],[184,517],[288,539],[450,558]]},{width:3.3,points:[[250,-40],[233,117],[274,233],[288,386],[277,800]]},{width:1.8,points:[[0,285],[75,261],[167,275],[274,233]]},{width:1.8,points:[[90,340],[94,263]]},{width:1.8,points:[[183,177],[206,330]]},{width:1.8,points:[[0,424],[102,508]]},{width:1.8,points:[[183,357],[184,517]]},{width:1.8,points:[[285,386],[337,290]]},{width:1.8,points:[[285,539],[341,466]]},{width:1.8,points:[[175,648],[279,646]]}];const buildings=[];for(let row=0;row<14;row++){for(let col=0;col<8;col++){const x=20+col*47+(row%2)*10,y=115+row*42+(col%3)*4;const skip=roads.some(r=>r.points.some(p=>Math.hypot(p[0]-x,p[1]-y)<17));if(!skip){const k=(col*17+row*11)%7;buildings.push({x,y,w:14+k*2.1,h:10+((col*5+row*7)%12),rot:((row+col)%5-2)*0.065})}}}
function themeVal(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()}

// FIELD ATLAS map styling v0.2: understated geographic hierarchy.
// Uses OpenMapTiles layers from the OpenFreeMap OSM source. No CARTO tiles.
// All source, font and icon URLs must be replaced with local resources for the offline release.
function makeStyle(){
  const dark=state.theme==='night';
  const p=dark
    ? {bg:'#10141e',land:'#151b27',park:'#1a2831',water:'#142c40',waterline:'#284155',
       building:'#2d3544',path:'#303b4b',local:'#435065',tertiary:'#536178',
       secondary:'#697890',major:'#8797ad',casing:'#0b111a',street:'#abb7c7',
       town:'#d8e0ec',route:'#e8d48b'}
    : {bg:'#07170f',land:'#0b2117',park:'#112d1e',water:'#0b2926',waterline:'#245045',
       building:'#254233',path:'#254b35',local:'#34684c',tertiary:'#467d5d',
       secondary:'#599471',major:'#79b58e',casing:'#05120b',street:'#9ac3a7',
       town:'#b5eac4',route:'#caffd7'};
  const src='osm';
  const roadSource={source:src,'source-layer':'transportation'};
  const namedRoad=['coalesce',['get','name:en'],['get','name'],''];
  const join={ 'line-join':'round', 'line-cap':'round' };
  const w=(a,b,c,d)=>['interpolate',['linear'],['zoom'],10,a,14,b,17,c,19,d];
  const klass=items=>['match',['get','class'],items,true,false];
  const road=(id,types,color,width,minzoom=9,extra={})=>({
    id,type:'line',...roadSource,minzoom,filter:klass(types),layout:join,
    paint:{'line-color':color,'line-width':width,'line-opacity':0.92,...extra}
  });
  return {
    version:8,
    glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{
      osm:{type:'vector',url:'https://tiles.openfreemap.org/planet'},
      'route-preview':{type:'geojson',data:{type:'FeatureCollection',features:[]}}
    },
    layers:[
      {id:'background',type:'background',paint:{'background-color':p.bg}},
      {id:'land',type:'fill',source:src,'source-layer':'landcover',
        paint:{'fill-color':p.land,'fill-opacity':0.30}},
      {id:'parks',type:'fill',source:src,'source-layer':'landuse',
        filter:klass(['park','grass','wood','forest','nature_reserve']),
        paint:{'fill-color':p.park,'fill-opacity':0.48}},
      {id:'water',type:'fill',source:src,'source-layer':'water',
        paint:{'fill-color':p.water}},
      {id:'streams',type:'line',source:src,'source-layer':'waterway',minzoom:11,
        layout:join,paint:{'line-color':p.waterline,'line-opacity':0.75,'line-width':w(0.35,0.6,1,1.35)}},
      // Building geometry stays intact. The styling is subdued, not simplified.
      {id:'buildings',type:'fill',source:src,'source-layer':'building',minzoom:13.2,
        layout:{visibility:state.showBuildings?'visible':'none'},
        paint:{'fill-color':p.building,'fill-opacity':['interpolate',['linear'],['zoom'],13,0.36,16,0.62,19,0.75]}},
      road('paths',['path','footway','cycleway','steps','pedestrian','bridleway'],p.path,w(0.25,0.48,0.75,1),13,
        {'line-dasharray':[2,2]}),
      road('local-roads',['minor','residential','living_street','service','unclassified','road','track'],p.local,w(0.35,1.0,1.7,2.45),11.2),
      road('tertiary-roads',['tertiary','tertiary_link'],p.tertiary,w(0.55,1.4,2.2,3.1),10),
      road('major-casing',['secondary','secondary_link','primary','primary_link','trunk','trunk_link','motorway','motorway_link'],p.casing,w(1.75,3.6,5.2,6.8),7),
      road('secondary-roads',['secondary','secondary_link'],p.secondary,w(1.1,2.1,3.1,4.1),8),
      road('primary-roads',['primary','primary_link','trunk','trunk_link','motorway','motorway_link'],p.major,w(1.45,2.65,3.9,5.1),7),
      {id:'route',type:'line',source:'route-preview',
        layout:join,paint:{'line-color':p.route,'line-width':3.5,'line-opacity':0.98,'line-dasharray':[2,2]}},
      {id:'street-labels',type:'symbol',source:src,'source-layer':'transportation_name',minzoom:13,
        layout:{'symbol-placement':'line','text-font':['Noto Sans Regular'],
          'text-field':namedRoad,'text-size':['interpolate',['linear'],['zoom'],13,9.5,16,11.5,19,12.4],
          'text-padding':8,'text-max-angle':35,'text-allow-overlap':false,'text-letter-spacing':0.015},
        paint:{'text-color':p.street,'text-opacity':0.87,'text-halo-color':p.bg,'text-halo-width':1.25,'text-halo-blur':0.25}},
      {id:'places',type:'symbol',source:src,'source-layer':'place',minzoom:5,
        filter:klass(['city','town','village','hamlet','suburb','neighbourhood']),
        layout:{'text-font':['Noto Sans Regular'],'text-field':namedRoad,
          'text-size':['interpolate',['linear'],['zoom'],7,10.5,12,12.5,16,14.5],

    ]
  };
}
