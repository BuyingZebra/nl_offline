<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<!-- Generated with the offline asset list by tools/build-tetris-release.mjs. -->
<meta name="tetris-build" content="191">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Draw the full-screen phosphor field behind the iPhone status bar.
     The JS layout already honors the top/bottom env(safe-area-inset-*) values. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<script>
// iOS Home Screen mode is confirmed by navigator.standalone on this device;
// the CSS (display-mode: standalone) media query incorrectly returns false.
// Apply the class before styles are evaluated; Safari tabs keep 100dvh.
if(navigator.standalone===true)document.documentElement.classList.add('ios-standalone');
</script>
<title>NOMAD — Tetris System</title>
<!-- Fallout 4-inspired UI/terminal fonts, with monospace fallback offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;background:#080808}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}
/* iOS black-translucent Home Screen viewport correction: navigator.standalone
   is reliable on this device, but height:100% on html/body resolves to the
   793px layout viewport rather than the measured full 852px screen. This
   clips the 800px game footer even when #display itself is 100vh. Match the
   root and document heights to the actual full viewport, exclusively in PWA. */
html.ios-standalone,html.ios-standalone body{height:100vh}
/* Treat the game canvas as a touch controller, not selectable webpage text. */
#display{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent}
/* iOS Home Screen may report (display-mode: standalone)=false even when
   navigator.standalone=true. The measured 100vh is the full 852px screen,
   whereas 100dvh is only 793px on the affected device. */
html.ios-standalone #display{height:100vh}
#screen{display:block;width:100%;height:100%;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 -webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
#safeArea{position:absolute;visibility:hidden;pointer-events:none;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#initials{position:fixed;left:50%;top:50%;width:2px;height:2px;opacity:.01;z-index:-1;
 padding:0;border:0;font-size:16px;pointer-events:none}
#error{position:fixed;inset:25px;color:#e9e9e9;background:#080808;
 font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;z-index:30}
#error[hidden]{display:none}
#rotateNotice{display:none;position:fixed;inset:0;place-content:center;text-align:center;
 padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
         max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 color:#e3e3e3;font:16px/1.5 "Roboto Condensed",ui-monospace,monospace}
#rotateNotice strong{font-size:18px;letter-spacing:.13em}
</style>
<!-- The renderer also uses this media condition to suspend the game. -->
<style id="portraitGate" media="(orientation: landscape) and (max-height: 600px) and (pointer: coarse)">
#display{visibility:hidden}
#rotateNotice{display:grid}
</style>
</head>
<body>
<div id="display" role="application" aria-label="Tetris System — Three.js">
 <canvas id="screen" aria-label="Tetris, with on-screen controls and CRT compositor"></canvas>
</div>
<div id="rotateNotice" role="status">
 <strong>NOMAD TETRIS</strong>
 <span>Rotate to portrait to continue.</span>
</div>
<div id="safeArea" aria-hidden="true"></div>
<div id="error" role="alert" hidden></div>
<script>
// Install the scoped offline cache. Registration is asynchronous and never
// interrupts an active game. A successful online install is needed before the
// app can be launched offline; subsequent visits can use its cached modules.
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
   .catch(error=>console.warn('NOMAD offline setup unavailable:',error));
 },{once:true});
}
</script>
<script type="module">
// Pin the renderer to the shell build so repeat visits can reuse its HTTP cache.
const build=document.querySelector('meta[name="tetris-build"]').content;
const freshModule='./three-v027.js?build='+build;
import(freshModule).catch(error=>{
 const banner=document.getElementById('error');
 banner.hidden=false;
 banner.textContent='Three.js renderer could not load. Please reconnect and reload.\n'+String(error);
 console.error('Tetris System renderer failed to start:',error);
});
</script>
</body>
</html>
