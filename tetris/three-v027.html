<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Draw the full-screen phosphor field behind the iPhone status bar.
     The JS layout already honors the top/bottom env(safe-area-inset-*) values. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<script>
// iOS Home Screen mode is confirmed by navigator.standalone on this device;
// the CSS (display-mode: standalone) media query incorrectly returns false.
// Apply the class before styles are evaluated; Safari tabs keep 100dvh.
if(navigator.standalone===true)document.documentElement.classList.add('ios-standalone');
</script>
<title>NOMAD — Tetris System V057</title>
<style>
:root{color-scheme:dark;background:#080808}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}
/* iOS black-translucent Home Screen viewport correction: navigator.standalone
   is reliable on this device, but height:100% on html/body resolves to the
   793px layout viewport rather than the measured full 852px screen. This
   clips the 800px game footer even when #display itself is 100vh. Match the
   root and document heights to the actual full viewport, exclusively in PWA. */
html.ios-standalone,html.ios-standalone body{height:100vh}
#display{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;touch-action:none}
/* iOS Home Screen may report (display-mode: standalone)=false even when
   navigator.standalone=true. The measured 100vh is the full 852px screen,
   whereas 100dvh is only 793px on the affected device. */
html.ios-standalone #display{height:100vh}
#screen{display:block;width:100%;height:100%;touch-action:none}
#safeArea{position:absolute;visibility:hidden;pointer-events:none;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#initials{position:fixed;left:50%;top:50%;width:2px;height:2px;opacity:.01;z-index:-1;
 padding:0;border:0;font-size:16px;pointer-events:none}
#error{position:fixed;inset:25px;color:#e9e9e9;background:#080808;
 font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;z-index:10}
#error[hidden]{display:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="display" role="application" aria-label="Tetris System — Three.js V057">
 <canvas id="screen" aria-label="Tetris, with on-screen controls and CRT compositor"></canvas>
</div>
<div id="safeArea" aria-hidden="true"></div>
<input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" aria-label="High-score initials">
<div id="error" role="alert" hidden></div>
<script src="./core.js?three=v027-r1"></script>
<script src="./scores.js?three=v027-r1"></script>
<script src="./layout.js?three=v050-r1"></script>
<script>
// Retire an old PixiJS Tetris worker if this installation still has one.
// Never unregister other repository service workers or clear saved scores.
if('serviceWorker' in navigator){
 navigator.serviceWorker.getRegistration(new URL('./',location.href)).then(reg=>{
  const script=reg?.active?.scriptURL||reg?.waiting?.scriptURL||reg?.installing?.scriptURL;
  if(script&&new URL(script).pathname===new URL('./sw.js',location.href).pathname)
   return reg.unregister();
 }).catch(()=>{});
}
if('caches' in window){
 caches.keys().then(keys=>Promise.all(
  keys.filter(key=>key.startsWith('field-atlas-arcade-')).map(key=>caches.delete(key))
 )).catch(()=>{});
}
</script>
<script type="module">
// Permanent bookmarkable URL: reload always requests the latest committed
// renderer module rather than reusing an old browser module-cache entry.
// This is a development-only cache buster; no new link per build is needed.
const freshModule='./three-v027.js?live='+Date.now();
import(freshModule).catch(error=>{
 const banner=document.getElementById('error');
 banner.hidden=false;
 banner.textContent='Three.js renderer could not load. Please reconnect and reload.\n'+String(error);
 console.error('FIELD ATLAS Three.js V027 failed to start:',error);
});
</script>
</body>
</html>
