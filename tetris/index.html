<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<title>FIELD ATLAS — Tetris System</title>
<style>
:root{color-scheme:dark;background:#151515;--safe-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515}
#game{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
#safeProbe{position:absolute;visibility:hidden;pointer-events:none;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#fatal{position:absolute;inset:20px;color:#cecece;font:14px monospace;z-index:3}
#fatal[hidden]{display:none}
#initialsNative{position:fixed;left:50%;top:48%;height:1px;width:1px;opacity:0;
 border:0;padding:0;font-size:16px;z-index:-1}

/* Developer-only geometry overlay, outside the PixiJS/CRT composition. */
#layoutDebugOverlay{position:fixed;inset:0;z-index:2147483000;pointer-events:none;overflow:hidden}
#layoutDebugOverlay[hidden]{display:none}
.layoutDebugBox{position:absolute;box-sizing:border-box;border:1.5px solid;background:transparent;pointer-events:none}
.layoutDebugBox>span{position:absolute;left:1px;top:1px;max-width:calc(100% - 2px);
 padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
 background:rgba(0,0,0,.86);color:var(--outline);font:700 9px/1.1 ui-monospace,monospace}
#layoutDebugToggle{position:fixed;z-index:2147483001;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);
 transform:translateX(-50%);padding:4px 9px;border:1px solid #00e5ff;border-radius:3px;
 background:#070707;color:#00e5ff;font:700 10px/1.2 ui-monospace,monospace;
 min-height:24px;touch-action:manipulation}
#layoutDebugToggle[aria-pressed="false"]{border-color:#999;color:#aaa}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Tetris System"></div>
<div id="safeProbe" aria-hidden="true"></div>
<div id="fatal" role="alert" hidden></div>
<input id="initialsNative" maxlength="3" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" aria-label="High score initials">
<script>
/* One-time Tetris-only effects and offline-cache reset. Preserve high scores,
   gameplay controls and FIELD ATLAS map caches/settings. */
(()=>{
 const marker='fieldAtlasTetrisAllEffectsOffV029';
 try{
  if(localStorage.getItem(marker)!=='yes'){
   for(const key of ['fieldAtlasEffectsV06','fieldAtlasTetrisSweepV01',
      'fieldAtlasTetrisGradientsV01','fieldAtlasTetrisExperimentalV01']){
    localStorage.removeItem(key);
   }
   localStorage.setItem(marker,'yes');
   if('caches' in window)void caches.keys().then(keys=>Promise.all(
     keys.filter(key=>key.startsWith('field-atlas-arcade-')).map(key=>caches.delete(key))
   )).catch(()=>{});
  }
 }catch(error){console.warn('Tetris visual reset unavailable:',error);}
})();
</script>
<script src="./core.js?arcade=v029"></script>
<script src="./scores.js?arcade=v029"></script>
<script src="./vendor/pixi.min.js?arcade=v029"></script>
<script src="./pixi-crt.js?arcade=v029"></script>

<script>
/* Same minimal pattern as IDG Calculator: toggle + coloured bounding boxes.
   This DOM overlay is ABOVE the WebGL canvas, never part of its effects. */
window.FieldAtlasLayoutDebug=(()=>{
 const dev=new URLSearchParams(location.search).has('debug');
 if(!dev)return {enabled:false,setLayout(){},setModal(){},getState(){return {enabled:false};}};
 const overlay=document.createElement('div'),toggle=document.createElement('button');
 overlay.id='layoutDebugOverlay';overlay.setAttribute('aria-hidden','true');
 toggle.id='layoutDebugToggle';toggle.type='button';toggle.textContent='LAYOUT';
 toggle.title='Toggle container outlines';toggle.setAttribute('aria-label','Toggle layout outlines');
 document.body.append(overlay,toggle);
 const palette=['#ff1744','#00e5ff','#76ff03','#ff9100','#d500f9',
                '#ffff00','#00b0ff','#ff4081','#00e676','#ff6d00'];
 let enabled=false,regions=[],modal=null;
 const draw=()=>{
  overlay.hidden=!enabled;overlay.replaceChildren();
  toggle.setAttribute('aria-pressed',String(enabled));
  if(!enabled)return;
  const group=modal?[regions[0],modal].filter(Boolean):regions;
  const fragment=document.createDocumentFragment();
  group.forEach((r,i)=>{
   if(!r||r.w<=0||r.h<=0)return;
   const box=document.createElement('div');box.className='layoutDebugBox';
   box.style.cssText='left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+r.h+
      'px;border-color:'+palette[i%palette.length]+';--outline:'+palette[i%palette.length]+';';
   const label=document.createElement('span');label.textContent=r.name;
   box.appendChild(label);fragment.appendChild(box);
  });
  overlay.appendChild(fragment);
 };
 toggle.addEventListener('click',()=>{enabled=!enabled;draw();});
 return {
  get enabled(){return enabled;},
  setLayout(next){regions=next;draw();},
  setModal(next){modal=next;draw();},
  getState:()=>({enabled,regions,modal})
 };
})();
</script>
<script src="./pixi-ui.js?arcade=v029"></script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js?arcade=v029',{scope:'./',updateViaCache:'none'}).catch(error=>{
    console.warn('Offline Tetris cache unavailable:',error);
  });
}
</script>
</body>
</html>
