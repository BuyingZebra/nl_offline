#game canvas{display:block;width:100%;height:100%;touch-action:none}

#fatal[hidden]{display:none}
#initialsNative{position:fixed;left:50%;top:48%;height:1px;width:1px;opacity:0;
 border:0;padding:0;font-size:16px;z-index:-1}
