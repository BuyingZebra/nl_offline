name: V092 one-time verified Three.js core vendor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-three-core-v092.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify pinned r180 three.core.js
        run: |
          set -euo pipefail
          mkdir -p tetris/vendor/three
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.core.js \
            --output tetris/vendor/three/three.core.js
          ACTUAL="$(git hash-object tetris/vendor/three/three.core.js)"
          EXPECTED="7dcd0fbcbc04b8d9a20ecb96c1ce344cb55150d5"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Pinned upstream blob SHA mismatch: $ACTUAL"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tetris/vendor/three/three.core.js
          git commit -m "V092: vendor verified Three.js r180 core dependency"
          git push origin HEAD:main
