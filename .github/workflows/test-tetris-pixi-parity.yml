name: Tetris PixiJS Migration Parity
on:
  push:
    branches: [main]
    paths:
      - 'tetris/renderer-pixi.js'
      - 'tetris/index.html'
      - 'tetris/vendor/**'
      - 'tests/test_tetris_pixi_parity.py'
      - '.github/workflows/test-tetris-pixi-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mobile testing runtime
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow>=10,<12'
          python -m playwright install ${{ matrix.browser }} --with-deps
      - name: Serve canonical Tetris
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/pixi-parity.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/tetris/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Compare real interface and GPU mirror
        env:
          FIELD_ATLAS_BROWSER: ${{ matrix.browser }}
        run: python tests/test_tetris_pixi_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixi-vs-native-${{ matrix.browser }}
          path: work/pixi-parity/*.png
          retention-days: 7
          if-no-files-found: warn
