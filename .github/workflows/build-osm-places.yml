name: Build map-label place index
on:
  push:
    branches: ['feature/osm-labelled-search-v0-30']
    paths:
      - 'tools/merge-osm-map-places.py'
      - 'data/nl-official-places.json'
      - '.github/workflows/build-osm-places.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map-places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast OSM PBF streaming reader
        run: pip install osmium
      - name: Download NL OpenStreetMap extract
        run: |
          curl --fail --location --retry 3 --show-error \
            --output /tmp/nl-latest.osm.pbf \
            https://download.geofabrik.de/north-america/canada/newfoundland-and-labrador-latest.osm.pbf
          test "$(stat -c %s /tmp/nl-latest.osm.pbf)" -gt 100000000
      - name: Merge all map-label community nodes with NRCan fallback
        run: python tools/merge-osm-map-places.py /tmp/nl-latest.osm.pbf
      - name: Assert provenance and distinct map-labelled Wild Cove positions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          official=json.loads(Path("data/nl-official-places.json").read_text())["places"]
          derived=json.loads(Path("data/nl-places.json").read_text())["places"]
          ids={x["id"] for x in official}
          assert all(p.get("officialId") in ids for p in derived if p.get("officialId"))
          anchors=[p for p in derived if p.get("mapAnchor")]
          assert len(anchors)>=500
          wild=[p for p in anchors if p["name"]=="Wild Cove"]
          assert any(p["region"]=="Baie Verte Peninsula" for p in wild)
          assert any(p["region"]=="Twillingate / Notre Dame Bay" for p in wild)
          assert len([p for p in derived if p["name"]=="Twillingate"])==1
          print("PASSED:",len(derived),"places;",len(anchors),"matching map-label nodes")
          PY
      - name: Commit validated index back to development branch
        run: |
          git add data/nl-places.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="field-atlas-builder[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "data(search): use OSM label anchors for NL town index [skip ci]"
          git push origin HEAD:feature/osm-labelled-search-v0-30
