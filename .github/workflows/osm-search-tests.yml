name: NL Map-label Search Tests
on:
  push:
    branches: ['feature/osm-labelled-search-v0-30']
    paths:
      - 'index.html'
      - 'data/*.json'
      - 'tests/*.test.mjs'
      - 'tools/*.py'
      - '.github/workflows/osm-search-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify search and unchanged visual controls
        run: node --test tests/*.test.mjs
      - name: Validate Python index builder syntax
        run: python -m py_compile tools/build-nl-places.py tools/merge-osm-map-places.py
