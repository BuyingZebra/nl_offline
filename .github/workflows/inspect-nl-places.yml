name: Inspect NL Place Data
on:
  push:
    branches: ['feature/complete-town-search-v0-29']
    paths: ['.github/workflows/inspect-nl-places.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official Newfoundland and Labrador names archive
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,csv,collections
          url='https://ftp.maps.canada.ca/pub/nrcan_rncan/vector/geobase_cgn_toponyme/prov_csv_eng/cgn_nl_csv_eng.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'FIELD-ATLAS/0.29 (Geographical Names search; GitHub Actions)'})
          with urllib.request.urlopen(req,timeout=90) as response: raw=response.read()
          print('ARCHIVE BYTES',len(raw))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            print('FILES',z.namelist())
            for name in z.namelist():
              if not name.lower().endswith(('.csv','.txt')):continue
              text=z.read(name).decode('utf-8-sig',errors='replace')
              print('FILE',name,'START',repr(text[:500]))
              reader=csv.DictReader(io.StringIO(text))
              print('HEADERS',reader.fieldnames)
              rows=list(reader)
              print('ROW COUNT',len(rows))
              for col in reader.fieldnames or []:
                if any(term in col.lower() for term in ['concise','type','generic','status','feature']):
                  print('COLUMN',col,'TOP',collections.Counter(r.get(col) for r in rows).most_common(25))
              print('EXAMPLE ROWS',rows[:2])
          PY
      - name: Inspect NL provincial community point layer
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,collections
          service='https://services8.arcgis.com/aCyQID5qQcyrJMm2/ArcGIS/rest/services/Communities/FeatureServer/0/query'
          params={'where':'1=1','outFields':'*','returnGeometry':'true','outSR':4326,'f':'geojson'}
          url=service+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'FIELD-ATLAS/0.29 (community index research)'})
          with urllib.request.urlopen(req,timeout=100) as response:
            raw=response.read()
            print('SERVICE_STATUS',response.status,'BYTES',len(raw))
          data=json.loads(raw)
          print('META',str({k:v for k,v in data.items() if k!='features'})[:900])
          records=data.get('features',[])
          print('PROVINCIAL FEATURE COUNT',len(records))
          print('SAMPLES',json.dumps(records[:3],ensure_ascii=False)[:1600])
          labels=[f.get('properties',{}).get('name','') for f in records]
          print('KNOWN SEARCH',[(q,[(n,records[i].get('geometry')) for i,n in enumerate(labels) if q.lower() in n.lower()][:4]) for q in ['Natuashish','Goose Bay','Carbonear','Bay Roberts']])
          PY
