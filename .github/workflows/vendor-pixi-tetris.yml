name: Vendor PixiJS Renderer for Tetris
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-pixi-tetris.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned PixiJS 8.22.0 with MIT license for offline Tetris
        run: |
          mkdir -p tetris/vendor /tmp/field-atlas-pixi
          cd /tmp/field-atlas-pixi
          npm pack pixi.js@8.22.0 --silent
          tar -xzf pixi.js-8.22.0.tgz
          ls -la package/dist | head -50
          if test -s package/dist/pixi.min.js; then
            cp package/dist/pixi.min.js "$GITHUB_WORKSPACE/tetris/vendor/pixi.min.js"
          elif test -s package/dist/pixi.js; then
            cp package/dist/pixi.js "$GITHUB_WORKSPACE/tetris/vendor/pixi.min.js"
          else
            echo 'PixiJS UMD distribution missing; refusing to publish a broken vendor file'
            exit 1
          fi
          cp package/LICENSE "$GITHUB_WORKSPACE/tetris/vendor/pixi-LICENSE"
      - name: Commit pinned renderer dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tetris/vendor/pixi.min.js tetris/vendor/pixi-LICENSE
          if git diff --cached --quiet; then
            echo 'Vendor already current'
          else
            git commit -m 'Vendor pinned PixiJS renderer with offline license'
            git push
          fi
