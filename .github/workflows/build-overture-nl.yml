name: Build Overture Newfoundland transportation map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-overture-nl.yml"
      - "tools/prepare_overture_segments.py"
      - "tools/build_overture_preview.py"

permissions:
  contents: write

concurrency:
  group: build-overture-nl
  cancel-in-progress: true

jobs:
  roads:
    name: Import entire Newfoundland Overture transportation network
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Overture official importer and geospatial libraries
        run: |
          python -m pip install "overturemaps>=0.16,<1" "pyarrow>=18,<25" "shapely>=2.1,<3"
      - name: Download Overture transportation across Newfoundland island bbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source work/output
          # Area box includes Newfoundland's northern peninsula; any nearby
          # mainland records must be clipped in a future coastline build.
          overturemaps download --bbox=-59.9,46.3,-52.4,51.75 -f geoparquet \
            --type=segment -o work/source/overture_nl_segments.parquet
          overturemaps download --bbox=-59.9,46.3,-52.4,51.75 -f geoparquet \
            --type=connector -o work/source/overture_nl_connectors.parquet
          test -s work/source/overture_nl_segments.parquet
          test -s work/source/overture_nl_connectors.parquet
          du -h work/source/*
      - name: Separate motor roads, footpaths and tracks; preserve source IDs
        run: |
          python tools/prepare_overture_segments.py \
            --segments work/source/overture_nl_segments.parquet \
            --output work/output/overture_roads.geojsonseq \
            --report work/output/overture_source_report.json \
            --carbonear work/output/overture_carbonear_streets.geojson
      - name: Install Tippecanoe open-source vector-tile compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends git g++ make libsqlite3-dev zlib1g-dev
          git clone --quiet --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j2
      - name: Build independent detailed offline Overture MBTiles
        shell: bash
        run: |
          set -euo pipefail
          /tmp/tippecanoe/tippecanoe -f -Z0 -z15 \
            --no-feature-limit --no-tile-size-limit \
            -l overture_transportation \
            -o work/output/nl_overture_transportation.mbtiles \
            work/output/overture_roads.geojsonseq
          test -s work/output/nl_overture_transportation.mbtiles
      - name: Generate lightweight preview from own Overture tiles
        run: |
          python tools/build_overture_preview.py \
            --tiles work/output/nl_overture_transportation.mbtiles \
            --output overture-preview-data.js \
            --report overture-preview-metadata.json
      - name: Upload original routing topology and full-resolution road tiles
        uses: actions/upload-artifact@v4
        with:
          name: nl-overture-offline-transportation
          path: |
            work/source/overture_nl_segments.parquet
            work/source/overture_nl_connectors.parquet
            work/output/nl_overture_transportation.mbtiles
            work/output/overture_source_report.json
            work/output/overture_carbonear_streets.geojson
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish Overture preview and audit data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/overture
          cp work/output/overture_source_report.json data/overture/source_report.json
          cp work/output/overture_carbonear_streets.geojson data/overture/carbonear_streets.geojson
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overture-preview-data.js overture-preview-metadata.json \
            data/overture/source_report.json data/overture/carbonear_streets.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Publish independent Overture NL offline transportation map preview [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
