name: Town Search Regression Tests
on:
  push:
    branches: ['feature/complete-town-search-v0-29', 'feature/osm-labelled-search-v0-30']
    paths:
      - 'index.html'
      - 'data/nl-places.json'
      - 'tests/*.test.mjs'
      - '.github/workflows/town-search-tests.yml'
  workflow_dispatch:
jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test unchanged UI and NL town-search navigation
        run: node --test tests/*.test.mjs
