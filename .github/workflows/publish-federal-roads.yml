name: Publish federal road source for map inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-federal-roads.yml"
      - "tools/publish_federal_roads.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: nl-federal-road-overlay
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIS tools
        run: python -m pip install "geopandas==1.1.1" "shapely==2.1.2" "pyogrio==0.11.1"
      - name: Retrieve the authoritative National Road Network source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-nl-map.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$R" && test "$R" != null || exit 1
          mkdir -p work/reference data/road_audits
          gh run download "$R" --repo "$GITHUB_REPOSITORY" --name nl-reference-data --dir work/reference
          test -s work/reference/nl_reference.gpkg
      - name: Prepare province-wide federal road display geometry
        run: |
          python tools/publish_federal_roads.py \
            --reference work/reference/nl_reference.gpkg \
            --output data/road_audits/federal_nrn_roads.geojson.gz
      - name: Upload reusable source overlay
        uses: actions/upload-artifact@v4
        with:
          name: nl-federal-nrn-road-display
          path: |
            data/road_audits/federal_nrn_roads.geojson.gz
            data/road_audits/federal_roads_manifest.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Commit federal road display layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/road_audits/federal_nrn_roads.geojson.gz data/road_audits/federal_roads_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish NL province-wide federal road visual overlay [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
