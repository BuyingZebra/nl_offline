name: Integrated Native Tetris WebGL Bloom Smoke
on:
  push:
    branches: [main]
    paths:
      - 'tetris/prototypes/integrated-webgl-bloom-v1.html'
      - 'tetris/prototypes/integrated-webgl-bloom-v1.js'
      - '.github/workflows/test-tetris-integrated-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browsers
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install ${{ matrix.browser }} --with-deps
      - name: Serve local offline-compatible prototype
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-integrated.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/tetris/prototypes/integrated-webgl-bloom-v1.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Check real Tetris controls and GPU capture (no full release QA)
        env:
          LAB_BROWSER: ${{ matrix.browser }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              engine=os.environ['LAB_BROWSER']
              args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'] if engine=='chromium' else []
              browser=getattr(p,engine).launch(headless=True,args=args)
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/tetris/prototypes/integrated-webgl-bloom-v1.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('() => !!window.__integratedGpuLab',timeout=15000)
              page.wait_for_timeout(1800)
              s=page.evaluate('window.__integratedGpuLab.getState()')
              print(engine,'initial GPU:',s)
              assert s['webgl2'] and s['realDOM'] and s['active'],s
              assert s['captures']>0 and s['processed']>0,('Capture/GPU inactive',s)
              assert s['sourceWidth']>0 and s['sourceHeight']>0,s
              assert page.locator('#board').count()==1
              assert page.locator('#optionsButton').count()==1
              assert page.locator('#webglBloom').evaluate('(el) => getComputedStyle(el).pointerEvents')=='none'
              # Actual UI elements receive clicks, not a canvas-based fake menu.
              output=Path('work/integrated-webgl')
              output.mkdir(parents=True,exist_ok=True)
              page.screenshot(path=str(output/(engine+'-real-ui.png')),full_page=True)
              page.locator('#playButton').click()
              page.wait_for_function('() => document.getElementById("veil").classList.contains("hidden")',timeout=10000)
              page.locator('#optionsButton').click()
              page.wait_for_function('() => document.getElementById("options").open',timeout=10000)
              page.locator('#gpuLabEcho').check()
              assert page.evaluate('window.__integratedGpuLab.getState().echo')
              page.locator('#gpuLabOn').uncheck()
              assert not page.evaluate('window.__integratedGpuLab.getState().active')
              page.locator('#gpuLabOn').check()
              assert page.evaluate('window.__integratedGpuLab.getState().active')
              page.locator('#closeOptions').click()
              assert not page.locator('#options').evaluate('(el) => el.open')
              assert not errors,errors
              print(engine,'PASS real native game + GPU light layer')
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webgl-${{ matrix.browser }}
          path: work/integrated-webgl/*.png
          retention-days: 4
