name: Catalog all NL orthophoto coverage tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-orthophoto-coverage.yml"
      - "tools/catalog_orthophoto_coverage.py"

permissions:
  contents: write

concurrency:
  group: nl-orthophoto-coverage
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install "requests==2.32.3"
      - name: Download all provincial orthophoto coverage footprints
        run: |
          python tools/catalog_orthophoto_coverage.py --output data/imagery/orthophoto_coverage.geojson
      - name: Upload complete imagery-coverage index
        uses: actions/upload-artifact@v4
        with:
          name: nl-orthophoto-coverages
          path: data/imagery/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish up-to-date imagery index for road inspector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imagery/orthophoto_coverage.geojson data/imagery/orthophoto_coverage_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NL orthophoto imagery coverage index [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
