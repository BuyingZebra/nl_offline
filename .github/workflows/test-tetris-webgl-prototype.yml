name: Tetris WebGL Prototype Smoke
on:
  push:
    branches: [main]
    paths:
      - 'experiments/tetris-webgl-compositor-v1.html'
      - '.github/workflows/test-tetris-webgl-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium --with-deps
      - name: Start local prototype server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/webgl-lab-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/experiments/tetris-webgl-compositor-v1.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify WebGL shader startup and prototype controls
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8765/experiments/tetris-webgl-compositor-v1.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=[
              '--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            page=browser.new_page(viewport={'width':390,'height':844},
                                  device_scale_factor=2,is_mobile=True,has_touch=True)
            errors=[]
            page.on('pageerror',lambda e:errors.append(str(e)))
            page.goto(url,wait_until='networkidle',timeout=30000)
            page.wait_for_function('() => !!window.__compositorLab',timeout=15000)
            original=page.evaluate('window.__compositorLab.getState()')
            print('Startup state:',original)
            assert original['webgl2'] and original['pixelWidth']>0
            assert original['order']==['scanlines','glow','phosphor']
            assert len(original['programs'])==6
            assert original['menusDrawnIntoSource']
            page.evaluate("window.__compositorLab.setOrder(['phosphor','scanlines','glow'])")
            assert page.evaluate('window.__compositorLab.getState().order')==['phosphor','scanlines','glow']
            page.evaluate('window.__compositorLab.openMenu()')
            page.wait_for_timeout(100)
            page.evaluate('window.__compositorLab.closeMenu()')
            page.evaluate('window.__compositorLab.start()')
            page.keyboard.press('Space')
            page.wait_for_timeout(150)
            assert not errors,errors
            assert 'Shader' not in page.locator('#warning').inner_text()
            print('Prototype GPU and interaction smoke check passed')
            browser.close()
          PY
