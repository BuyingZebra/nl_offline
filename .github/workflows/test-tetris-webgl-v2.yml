name: Tetris WebGL Compositor V2 Quick Smoke
on:
  push:
    branches: [main]
    paths:
      - 'experiments/tetris-webgl-compositor-v2.html'
      - '.github/workflows/test-tetris-webgl-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shader-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quick Chromium test
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium --with-deps
      - name: Serve isolated V2
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/webgl-v2.log 2>&1 &
          for n in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/experiments/tetris-webgl-compositor-v2.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify shader compilation and controls, not full release
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/experiments/tetris-webgl-compositor-v2.html',wait_until='networkidle',timeout=30000)
              page.wait_for_function('() => !!window.__compositorLab',timeout=15000)
              state=lambda:page.evaluate('window.__compositorLab.getState()')
              x=state()
              print('V2 startup:',x)
              assert x['webgl2'] and x['pixelWidth']>0
              assert x['order']==['phosphor','glow','ghost','scanlines']
              assert not x['ghostOn']
              assert all(v in x['programs'] for v in ('copy','scanlines','tint','extract','blur','combine','ghost'))
              processed=page.locator('#screen').screenshot()
              page.locator('#effectsOn').uncheck()
              page.wait_for_timeout(100)
              raw=page.locator('#screen').screenshot()
              assert processed!=raw,'Compositor has no effect on the final image'
              page.locator('#effectsOn').check()
              page.locator('#ghostOn').check()
              page.wait_for_timeout(100)
              assert state()['ghostOn']
              ghosted=page.locator('#screen').screenshot()
              assert ghosted!=processed,'Ghost pass does not change the image'
              page.evaluate("window.__compositorLab.setOrder(['ghost','scanlines','glow','phosphor'])")
              assert state()['order']==['ghost','scanlines','glow','phosphor']
              page.evaluate('window.__compositorLab.openMenu()')
              page.wait_for_timeout(80)
              page.evaluate('window.__compositorLab.closeMenu();window.__compositorLab.start()')
              page.keyboard.press('Space')
              page.wait_for_timeout(100)
              assert state()['gameStatus']=='playing',state()
              assert not errors,errors
              assert not page.locator('#warning').is_visible()
              print('V2 quick shader/interaction smoke PASSED')
              browser.close()
          PY
