name: FIELD ATLAS Arcade / Tetris Tests
on:
  push:
    branches: [main]
    paths:
      - 'tetris/**'
      - 'tests/field-atlas-tetris.test.cjs'
      - '.github/workflows/test-field-atlas-tetris.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game rules, touch UI, and offline shell
        run: node --test tests/field-atlas-tetris.test.cjs
