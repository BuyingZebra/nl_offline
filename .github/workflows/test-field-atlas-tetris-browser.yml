name: NOMAD Tetris — technical quality gate

on:
  push:
    branches: [main, nomad-v176-upgrade-verify]
    paths:
      - 'tetris/**'
      - 'tests/test_tetris_browser.py'
      - '.github/workflows/test-field-atlas-tetris-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical:
    name: Fast technical checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game rules, storage, module boundaries and hidden edge cases
        run: |
          node --test \
            tetris/tests/*.test.mjs \
            tetris/tests/*.test.cjs \
            tetris/build-version-v066.test.cjs \
            tetris/compositor.test.cjs \
            tetris/debug-report.test.cjs \
            tetris/layout.test.cjs \
            tetris/module-contract-v066.test.cjs \
            tetris/ui-controls-v065.test.cjs

  browser:
    name: Optional browser and offline launch smoke
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pwa-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow>=10,<12'
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            google-chrome --version
          else
            python -m playwright install ${{ matrix.browser }} --with-deps
          fi
      - name: Start app server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/nomad-tetris-http.log 2>&1 &
          for n in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/tetris/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Check boot, WebGL output and viewport changes
        env:
          FIELD_ATLAS_BROWSER: ${{ matrix.browser }}
          FIELD_ATLAS_USE_CHROME: ${{ matrix.browser == 'chromium' && '1' || '0' }}
        run: python tests/test_tetris_browser.py
      - name: Upload optional browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomad-tetris-${{ matrix.browser }}
          path: work/browser-test/*.png
          retention-days: 7
          if-no-files-found: ignore
