name: Build FIELD ATLAS v0.32 native OSM region
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-field-atlas-v032-region.yml'
      - 'tools/build_field_atlas_v032_detail.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-atlas-v032-data
  cancel-in-progress: false

jobs:
  native-osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM parser and geographic clipping library
        run: python -m pip install --disable-pip-version-check 'osmium>=4,<5' 'shapely>=2.1,<3'
      - name: Download original OSM Newfoundland source data
        run: |
          set -euo pipefail
          mkdir -p work/osm data/osm-detail
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            https://download.geofabrik.de/north-america/canada/newfoundland-and-labrador-latest.osm.pbf \
            -o work/osm/newfoundland-labrador.osm.pbf
          test -s work/osm/newfoundland-labrador.osm.pbf
      - name: Extract Carbonear-region full-detail roads, buildings and inland water
        run: |
          set -euo pipefail
          python tools/build_field_atlas_v032_detail.py \
            --pbf work/osm/newfoundland-labrador.osm.pbf \
            --out data/osm-detail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("data/osm-detail")
          report=json.loads((root/"carbonear_report.json").read_text())
          print(report)
          assert report["counts"].get("roads",0)>100
          assert report["counts"].get("buildings",0)>200
          for p in root.glob("*.geojson"):
              obj=json.loads(p.read_text())
              assert obj["type"]=="FeatureCollection"
          PY
      - name: Publish small independent regional OSM geometry files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/osm-detail/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish high-fidelity OSM Carbonear test region [skip ci]'
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
