name: Catalog NL provincial maps and imagery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-provincial-maps.yml"
      - "tools/catalog_provincial_maps.py"

permissions:
  contents: write

concurrency:
  group: provincial-map-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog dependencies
        run: python -m pip install "requests==2.32.3" "beautifulsoup4==4.13.4"
      - name: Index all provincial map images and discover GIS source layers
        run: python tools/catalog_provincial_maps.py --output data/provincial_maps
      - name: Check catalog generated successfully
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("data/provincial_maps/provincial_map_inventory.json")
          summary=json.loads(path.read_text())
          print(json.dumps({k: summary[k] for k in ("linked_index_images","sheet_count","arcgis_layer_count")}, indent=2))
          assert summary["linked_index_images"] > 100
          PY
      - name: Upload provenance and image inventory
        uses: actions/upload-artifact@v4
        with:
          name: provincial-imagery-and-gis-source-catalog
          path: data/provincial_maps/*
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
      - name: Update catalog for GitHub Pages browser
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/provincial_maps/
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update NL provincial image and GIS source inventory [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
