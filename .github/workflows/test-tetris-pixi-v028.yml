name: Tetris Unified PixiJS V028
on:
  push:
    branches: [main]
    paths:
      - 'tetris/pixi.html'
      - 'tetris/pixi-ui.js'
      - 'tetris/pixi-crt.js'
      - 'tests/test_tetris_pixi_v028.py'
      - '.github/workflows/test-tetris-pixi-v028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install ${{ matrix.browser }} --with-deps
      - name: Serve FIELD ATLAS
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/arcade-pixi.log 2>&1 &
          for n in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/tetris/pixi.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify single PixiJS renderer
        env:
          FIELD_ATLAS_BROWSER: ${{ matrix.browser }}
        run: python tests/test_tetris_pixi_v028.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetris-pixi-v028-${{ matrix.browser }}
          path: work/tetris-pixi-v028/*.png
          retention-days: 5
          if-no-files-found: warn
