name: Download NL provincial resource roads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-provincial-roads.yml"
      - "tools/download_provincial_roads.py"

permissions:
  contents: write

jobs:
  resource-roads:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests and GIS converter
        run: |
          python -m pip install "requests==2.32.3"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdal-bin
      - name: Retrieve Newfoundland forestry department source road geometry and attributes
        run: python tools/download_provincial_roads.py --source ffa-island --output work/provincial-roads
      - name: Produce editable GeoPackage
        shell: bash
        run: |
          set -euo pipefail
          ogr2ogr -f GPKG \
            work/provincial-roads/nl_resource_access_roads.gpkg \
            work/provincial-roads/nl_resource_access_roads.geojson \
            -nln resource_access_roads -t_srs EPSG:4326
          ogrinfo -so work/provincial-roads/nl_resource_access_roads.gpkg resource_access_roads
      - name: Publish compact provenance and road counts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/road_audits
          cp work/provincial-roads/provincial_roads_report.json data/road_audits/provincial_roads_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/road_audits/provincial_roads_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record NL resource roads source quality and coverage [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save downloadable full-province resource-road files
        uses: actions/upload-artifact@v4
        with:
          name: nl-provincial-resource-roads
          path: |
            work/provincial-roads/nl_resource_access_roads.gpkg
            work/provincial-roads/nl_resource_access_roads.geojson
            work/provincial-roads/provincial_roads_report.json
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
