name: WebGL CRT Prototype Smoke
on:
  push:
    branches: [main]
    paths:
      - 'experiments/tetris-webgl-compositor-v1.html'
      - 'experiments/test_webgl_compositor_v1.py'
      - '.github/workflows/webgl-compositor-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow>=10,<12'
          python -m playwright install ${{ matrix.browser }} --with-deps
      - name: Start local preview server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/tetris-compositor-lab.log 2>&1 &
          for n in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/experiments/tetris-webgl-compositor-v1.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Quick WebGL prototype check
        env:
          LAB_BROWSER: ${{ matrix.browser }}
        run: python experiments/test_webgl_compositor_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-compositor-v1-${{ matrix.browser }}
          path: work/compositor-v1/*.png
          retention-days: 7
