name: Native Functional Pilot Checks

on:
  push:
    branches:
      - 'feature/native-functional-pilot-*'
  workflow_dispatch:

jobs:
  typecheck-and-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Source and functional-pilot tests
        run: npm test
