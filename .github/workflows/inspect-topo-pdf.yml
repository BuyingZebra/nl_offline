name: Inspect topographic PDF vector content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-topo-pdf.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inspection libraries
        run: python -m pip install "pymupdf==1.26.7" "requests==2.32.3"
      - name: Download and inspect a provincial topographic map
        run: python tools/inspect_topographic_pdf.py --output work/topo_pdf
      - name: Publish compact PDF structure report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/road_audits
          cp work/topo_pdf/topographic_pdf_inspection.json data/road_audits/topographic_pdf_inspection.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/road_audits/topographic_pdf_inspection.json
          if ! git diff --cached --quiet; then
            git commit -m "Record NL topographic PDF vector extraction test [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NL-topographic-PDF-vector-inspection
          path: work/topo_pdf/*
          retention-days: 14
          if-no-files-found: error
